name: Release All Platforms

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build or repair, e.g. v0.3.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release helpers
        run: python -m unittest discover -s scripts/tests -p 'test_release.py'
      - name: Resolve immutable source and validate versions
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/release.py resolve --tag "$RELEASE_TAG"

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy,rustfmt
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Prepare version metadata
        run: python .release-tools/scripts/release.py prepare --tag $env:RELEASE_TAG --sha $env:RELEASE_SHA
      - name: Core checks
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Flutter checks and build
        working-directory: app_flutter
        run: |
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter analyze
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter build windows --release --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows
        run: |
          if (Test-Path './scripts/test_windows_composer.ps1') { ./scripts/test_windows_composer.ps1 }
          if (Test-Path './scripts/test_windows_shell.ps1') { ./.release-tools/scripts/test_windows_shell.ps1 -SourceRoot $env:GITHUB_WORKSPACE }
          if (-not (Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --version=6.4.3 --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ./.release-tools/scripts/build_windows_setup.ps1 -Version '${{ needs.prepare.outputs.version }}' -SourceRoot $env:GITHUB_WORKSPACE
          ./.release-tools/scripts/test_windows_setup.ps1 -SourceRoot $env:GITHUB_WORKSPACE
          python .release-tools/scripts/release.py collect --platform windows --tag $env:RELEASE_TAG --sha $env:RELEASE_SHA
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-output/*
          if-no-files-found: error

  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-linux-android
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Prepare version metadata
        run: python .release-tools/scripts/release.py prepare --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"
      - name: Restore private signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_SIGNING_CERT_SHA256"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nekosend-release.jks"
      - name: Build signed Android release
        working-directory: app_flutter
        env:
          LAN_CHAT_ANDROID_STORE_FILE: ${{ runner.temp }}/nekosend-release.jks
          LAN_CHAT_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          LAN_CHAT_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LAN_CHAT_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release --target-platform android-arm64 --no-pub
      - name: Android JVM tests
        working-directory: app_flutter/android
        run: ./gradlew app:testDebugUnitTestCompatibility --no-daemon -Ptarget-platform=android-arm64
      - name: Verify signature and package
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$signer"
          "$signer" verify --verbose --print-certs --print-certs-pem app_flutter/build/app/outputs/flutter-apk/app-release.apk > "$RUNNER_TEMP/android-certificate.txt"
          python .release-tools/scripts/release.py collect --platform android --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --certificate-report "$RUNNER_TEMP/android-certificate.txt"
      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/nekosend-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-output/*
          if-no-files-found: error

  android-clipboard:
    needs: prepare
    uses: ./.github/workflows/android-composer.yml
    with:
      source_ref: ${{ needs.prepare.outputs.sha }}

  linux:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Prepare version metadata and test core
        run: |
          python .release-tools/scripts/release.py prepare --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"
          cargo test --workspace
          python scripts/verify_flatpak.py
      - name: Install Flatpak SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --noninteractive -y flathub org.gnome.Sdk//50 org.gnome.Platform//50 org.freedesktop.Sdk.Extension.llvm21//25.08
      - name: Build and package Linux
        run: |
          bash packaging/linux/build-flatpak.sh
          python .release-tools/scripts/release.py collect --platform linux --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-output/*
          if-no-files-found: error

  macos:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Prepare version metadata
        run: python .release-tools/scripts/release.py prepare --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"
      - name: Core and Flutter checks
        run: |
          cargo test --workspace
          cd app_flutter
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
      - name: Build macOS
        working-directory: app_flutter
        run: flutter build macos --release --no-pub
      - name: Package and launch macOS
        run: |
          bash .release-tools/packaging/macos/package.sh "$GITHUB_WORKSPACE"
          bash .release-tools/packaging/macos/smoke-test.sh "$GITHUB_WORKSPACE"
          python .release-tools/scripts/release.py collect --platform macos --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release-output/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-release-evidence
          path: dist/macos-evidence/
          if-no-files-found: ignore

  publish:
    needs: [prepare, windows, android, android-clipboard, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-output
          merge-multiple: true
      - name: Verify all four platforms and publish
        run: python scripts/release.py publish --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"
