name: Rust

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install sqlite --no-progress -y
      - name: Install SQLite on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy,rustfmt
      - name: Verify documentation
        shell: pwsh
        run: ./scripts/verify_docs.ps1
      - name: Verify Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/verify_windows_installer.ps1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
