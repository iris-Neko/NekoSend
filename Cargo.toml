[workspace]
members = ["core_rust", "perf_harness", "integration_harness"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
if-addrs = "0.15"
rand = "0.9"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = "0.6"
sysinfo = "0.37"
tempfile = "3.20"
thiserror = "2.0"
uuid = { version = "1.18", features = ["serde", "v4", "v7"] }

[profile.release]
codegen-units = 1
lto = "thin"
